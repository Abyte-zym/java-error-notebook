<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java面试错题本 | 免费·本地存储·按考点分类</title>
<meta name="description" content="Java面试错题本——记录每次面试答错的题目，按考点分类复习，本地存储不丢失。上千次面试实战总结，免费使用。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0;line-height:1.6;padding:16px;max-width:700px;margin:0 auto}
h1{color:#38bdf8;text-align:center;margin:20px 0 10px;font-size:1.4em}
.subtitle{text-align:center;color:#94a3b8;font-size:0.85em;margin-bottom:20px}
.stats{display:flex;gap:10px;justify-content:center;margin:16px 0;flex-wrap:wrap}
.stat{background:#1e293b;padding:10px 16px;border-radius:10px;text-align:center;min-width:80px}
.stat .num{font-size:1.5em;color:#facc15;font-weight:bold}
.stat .label{font-size:0.7em;color:#94a3b8}
.add-form{background:#1e293b;padding:16px;border-radius:12px;margin:16px 0}
.add-form select,.add-form input,.add-form textarea{width:100%;background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:10px;margin:6px 0;font-size:0.9em}
.add-form textarea{min-height:80px;resize:vertical}
.add-form button{background:#38bdf8;color:#0f172a;border:none;padding:10px 20px;border-radius:8px;font-weight:bold;cursor:pointer;width:100%;font-size:0.95em}
.add-form button:hover{background:#7dd3fc}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.filters button{background:#1e293b;color:#94a3b8;border:1px solid #334155;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:0.8em;transition:all .2s}
.filters button.active{background:#38bdf8;color:#0f172a;border-color:#38bdf8}
.error-card{background:#1e293b;border-left:3px solid #ef4444;border-radius:8px;padding:14px;margin:10px 0}
.error-card.corrected{border-left-color:#22c55e;opacity:0.7}
.error-card .company{font-size:0.75em;color:#38bdf8;margin-bottom:4px}
.error-card .question{font-weight:bold;margin:6px 0;font-size:0.95em}
.error-card .answer{color:#94a3b8;font-size:0.85em;margin:4px 0;line-height:1.5}
.error-card .actions{display:flex;gap:8px;margin-top:8px}
.error-card .actions button{background:transparent;border:1px solid #334155;color:#94a3b8;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:0.75em;transition:all .2s}
.error-card .actions button:hover{background:#334155}
.error-card .actions button.gotit{color:#22c55e;border-color:#22c55e}
.error-card .actions button.delete{color:#ef4444;border-color:#ef4444}
.empty{text-align:center;color:#64748b;padding:40px 20px;font-size:0.9em}
.donate{text-align:center;margin:30px 0;padding:20px;background:linear-gradient(135deg,#1e293b,#0f172a);border-radius:16px;border:2px solid #facc15}
.donate p{color:#facc15;margin-bottom:8px;font-size:0.95em}
.donate img{width:160px;border-radius:12px}
.donate .sub{color:#94a3b8;font-size:0.75em}
</style>
</head>
<body>

<h1>📝 Java面试错题本</h1>
<p class="subtitle">> 上千次BOSS沟通·30+场面试实战总结 | 本地存储·关闭浏览器也不会丢</p>

<div class="stats">
  <div class="stat"><div class="num" id="totalCount">0</div><div class="label">总错题</div></div>
  <div class="stat"><div class="num" id="todayCount">0</div><div class="label">今日新增</div></div>
  <div class="stat"><div class="num" id="masteredCount">0</div><div class="label">已掌握</div></div>
</div>

<div class="add-form">
  <input type="text" id="companyInput" placeholder="面试公司（如：字节跳动）">
  <select id="categoryInput">
    <option value="">考点分类</option>
    <option>Java基础</option><option>JVM</option><option>并发编程</option>
    <option>Spring</option><option>MySQL</option><option>Redis</option>
    <option>微服务</option><option>MQ</option><option>系统设计</option>
    <option>算法</option><option>网络/OS</option><option>其他</option>
  </select>
  <textarea id="questionInput" placeholder="面试官问的题目..."></textarea>
  <textarea id="answerInput" placeholder="正确答案（你自己的总结）..."></textarea>
  <button onclick="addError()">+ 记入错题本</button>
</div>

<div class="filters" id="filters">
  <button class="active" onclick="filterAll()">全部</button>
  <button onclick="filterCategory('Java基础')">Java基础</button>
  <button onclick="filterCategory('JVM')">JVM</button>
  <button onclick="filterCategory('并发编程')">并发</button>
  <button onclick="filterCategory('Spring')">Spring</button>
  <button onclick="filterCategory('MySQL')">MySQL</button>
  <button onclick="filterCategory('Redis')">Redis</button>
  <button onclick="filterCategory('微服务')">微服务</button>
  <button onclick="filterCategory('系统设计')">系统设计</button>
  <button onclick="filterCategory('算法')">算法</button>
</div>

<div id="errorList"></div>
<div class="empty" id="emptyState">📭 还没有错题记录<br><span style="font-size:0.85em;color:#475569">记下你面试中答错的每一道题，考前集中复习</span></div>

<div class="donate">
  <p>☕ 错题本帮到你了？</p>
  <p class="sub">📊 上千次面试实战总结 | 全部免费工具 → <a href="https://Abyte-zym.github.io/arsenal/" style="color:#facc15">弹药库首页</a></p>
  <img src="https://raw.githubusercontent.com/Abyte-zym/java-resume-builder/main/qrcode.png" alt="赞赏码" onerror="this.style.display='none'">
</div>

<script>
const STORAGE_KEY = 'java_error_notebook_v2';
let errors = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let currentFilter = 'all';

function save(){localStorage.setItem(STORAGE_KEY, JSON.stringify(errors));render();updateStats()}

function addError(){
  const company = document.getElementById('companyInput').value.trim();
  const category = document.getElementById('categoryInput').value;
  const question = document.getElementById('questionInput').value.trim();
  const answer = document.getElementById('answerInput').value.trim();
  if(!question){alert('至少填写题目');return}
  errors.unshift({id:Date.now(),company:company||'未知公司',category:category||'其他',question,answer,corrected:false,date:new Date().toISOString().slice(0,10)});
  document.getElementById('companyInput').value='';
  document.getElementById('questionInput').value='';
  document.getElementById('answerInput').value='';
  save();
}

function toggleCorrected(id){
  const e = errors.find(x=>x.id===id); if(e){e.corrected=!e.corrected;save()}
}
function deleteError(id){errors=errors.filter(x=>x.id!==id);save()}
function filterAll(){currentFilter='all';render();document.querySelectorAll('#filters button').forEach((b,i)=>b.className=i===0?'active':'')}
function filterCategory(cat){currentFilter=cat;render();document.querySelectorAll('#filters button').forEach(b=>b.className=b.textContent===cat||(cat==='all'&&b.textContent==='全部')?'active':'')}

function updateStats(){
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('totalCount').textContent=errors.length;
  document.getElementById('todayCount').textContent=errors.filter(e=>e.date===today).length;
  document.getElementById('masteredCount').textContent=errors.filter(e=>e.corrected).length;
}

function render(){
  const list = document.getElementById('errorList');
  const filtered = currentFilter==='all'?errors:errors.filter(e=>e.category===currentFilter);
  document.getElementById('emptyState').style.display=filtered.length?'none':'block';
  list.innerHTML = filtered.map(e=>`
    <div class="error-card${e.corrected?' corrected':''}">
      <div class="company">🏢 ${e.company} · ${e.category} · ${e.date}</div>
      <div class="question">❓ ${e.question}</div>
      ${e.answer?`<div class="answer">✅ ${e.answer}</div>`:''}
      <div class="actions">
        <button class="gotit" onclick="toggleCorrected(${e.id})">${e.corrected?'🔄 重新复习':'✅ 已掌握'}</button>
        <button class="delete" onclick="deleteError(${e.id})">🗑 删除</button>
      </div>
    </div>
  `).join('');
}

render();updateStats();
</script>
</body>
</html>
